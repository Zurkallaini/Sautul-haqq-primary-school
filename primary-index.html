<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5e1a2e">
<title>School Results Portal - Sautul Haqq</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap');
  :root{
    --wine:#5e1a2e;--wine-2:#7b2640;--wine-hi:#7e2a44;--wine-lo:#3d0f1d;
    --sand:#eae2d8;--hi:#fbf7f1;--lo:#c8bcae;
    --ink:#2a1a1f;--muted:#7a6a68;--gold:#c8a24a;--err:#b42318;
    --raise:8px 8px 18px var(--lo),-8px -8px 18px var(--hi);
    --raise-s:5px 5px 11px var(--lo),-5px -5px 11px var(--hi);
    --press:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;font-family:'Manrope','Segoe UI',sans-serif;color:var(--ink);background:var(--sand);display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:430px;border-radius:32px;overflow:hidden;background:var(--sand);box-shadow:var(--raise),0 24px 50px rgba(94,26,46,.12)}

  /* WINE TOP */
  .top{background:var(--wine);color:#fff;text-align:center;padding:34px 26px 46px;border-radius:0 0 50% 50% / 0 0 34px 34px}
  .arch{width:132px;height:156px;margin:0 auto 18px;border-radius:66px 66px 16px 16px;background:var(--wine);padding:10px;box-shadow:8px 8px 16px var(--wine-lo),-8px -8px 16px var(--wine-hi);display:flex;align-items:center;justify-content:center}
  .arch img{width:100%;height:100%;object-fit:contain;border-radius:56px 56px 8px 8px;background:#fff}
  .top h1{font-family:'Lora',Georgia,serif;font-size:24px;line-height:1.2;font-weight:700;margin-bottom:12px}
  .portal{display:inline-block;padding:8px 18px;border-radius:30px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f0d9a0;box-shadow:inset 4px 4px 8px var(--wine-lo),inset -4px -4px 8px var(--wine-hi)}

  /* SAND FORM */
  .body{padding:28px 28px 24px}
  .body h2{font-family:'Lora',Georgia,serif;font-size:22px;margin-bottom:3px}
  .sub{font-size:13.5px;color:var(--muted);margin-bottom:20px}

  .field{margin-bottom:18px}
  .field label{display:block;font-size:12.5px;font-weight:700;margin:0 0 8px 6px;color:#4a3a3d}
  .input{position:relative}
  .input input{width:100%;height:52px;padding:0 48px 0 18px;font:inherit;font-size:15px;color:var(--ink);background:var(--sand);border:none;border-radius:14px;box-shadow:var(--press);transition:box-shadow .2s}
  .input input::placeholder{color:#aa9e92}
  .input input:focus{outline:none;box-shadow:var(--press),0 0 0 2px rgba(94,26,46,.45)}
  .eye{position:absolute;right:8px;top:7px;width:38px;height:38px;border:none;border-radius:50%;background:var(--sand);box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi);cursor:pointer;font-size:16px}
  .eye:active{box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}

  /* ROLE SELECT - same style as inputs */
  .input select{width:100%;height:52px;padding:0 18px;font:inherit;font-size:15px;color:var(--ink);background:var(--sand);border:none;border-radius:14px;box-shadow:var(--press);cursor:pointer;appearance:none;-webkit-appearance:none}
  .input select:focus{outline:none;box-shadow:var(--press),0 0 0 2px rgba(94,26,46,.45)}
  .input select option{color:var(--ink);background:#fbf7f1}
  .select-arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:12px}

  .btn{width:100%;height:54px;margin-top:8px;border:none;border-radius:16px;background:var(--wine);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:7px 7px 14px var(--lo),-7px -7px 14px var(--hi);transition:box-shadow .15s}
  .btn:active,.btn.loading{box-shadow:inset 4px 4px 8px var(--wine-lo),inset -4px -4px 8px var(--wine-hi)}
  .btn.loading{pointer-events:none}
  .btn.loading .btn-text{opacity:0}
  .spinner{display:none;position:absolute;width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .btn.loading .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eye:focus-visible,.btn:focus-visible,.input select:focus-visible{outline:2px solid var(--wine-2);outline-offset:3px}

  .error{display:none;margin-top:16px;padding:12px 14px;border-radius:14px;box-shadow:var(--press);color:var(--err);font-size:13.5px;font-weight:700;text-align:center}
  .error.show{display:block;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--muted)}

  @media(max-width:480px){
    body{padding:0;align-items:stretch}
    .card{max-width:none;border-radius:0;box-shadow:none;min-height:100vh}
    .top{padding:26px 22px 42px}
    .arch{width:104px;height:124px;border-radius:52px 52px 14px 14px;margin-bottom:14px;padding:8px}
    .arch img{border-radius:44px 44px 6px 6px}
    .top h1{font-size:21px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="card">
  <section class="top">
    <div class="arch"><img src="my-logo.png" alt="Sautul Haqq Islamic School logo"></div>
    <h1>Sautul Haqq Primary School</h1>
    <div class="portal">Results Portal</div>
  </section>

  <section class="body">
    <h2>Sign in</h2>
    <p class="sub">Choose your role, then enter your details.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input"><input type="text" id="username" placeholder="Enter your username" autocomplete="username" required></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="eye" id="eye" aria-label="Show password">👁</button>
        </div>
      </div>

      <div class="field">
        <label for="role">Role</label>
        <div class="input">
          <select id="role" required>
            <option value="" disabled selected>Select your role</option>
            <option value="Admin">Admin</option>
            <option value="Teacher">Teacher</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </div>

      <button type="submit" class="btn" id="loginBtn">
        <span class="btn-text">Log in</span>
        <div class="spinner"></div>
      </button>
      <p class="error" id="errorMsg" role="alert">Invalid username, password or role.</p>
    </form>

    <div class="footer">© Sautul Haqq Primary School</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Show / hide password
const pw = document.getElementById('password');
const eye = document.getElementById('eye');
eye.addEventListener('click', () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  eye.textContent = show ? '🙈' : '👁';
  eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});

// --- SUPABASE LOGIN (unchanged) ---
const SUPABASE_URL = "https://izhxzibsixhbsucfquyt.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6aHh6aWJzaXhoYnN1Y2ZxdXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzk0NTgsImV4cCI6MjEwMDk1NTQ1OH0.vnP0BhywqE0kt1zrxwq7uGeJ76EOowOHXi5CNyMGWUM"
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showError(msg){
  const el = document.getElementById('errorMsg');
  el.innerText = msg;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const role = document.getElementById('role').value;
  const btn = document.getElementById('loginBtn');

  if(!role){ showError("Choose Admin or Teacher."); return; }
  if(!username || !password){ showError("Enter your username and password."); return; }

  document.getElementById('errorMsg').classList.remove('show');
  btn.classList.add('loading');

  const { data, error } = await db.rpc('check_primary_login', {
    p_username: username,
    p_password: password,
    p_role: role
  });

  btn.classList.remove('loading');

  if(error){
    showError(error.message);
    console.error(error);
    return;
  }

  if(data && data.success){
    localStorage.setItem('userRole', data.role);
    localStorage.setItem('username', data.username);
    if(data.role === 'Admin'){
      window.location.href = 'PrimaryAdminDashboard.html';
    } else {
      window.location.href = 'PrimaryTeacherCode.html';
    }
  } else {
    showError("Invalid username, password or role.");
  }
});
</script>
</body>
</html>
