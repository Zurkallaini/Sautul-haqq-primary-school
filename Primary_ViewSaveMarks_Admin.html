<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIEW SAVED MARKS - Admin Primary</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
html, body,.container { height:auto!important; overflow:visible!important; }
body{ background:#eae2d8; min-height:100vh; padding:20px; }
h1{ text-align:center; color:#5e1a2e; font-size:32px; margin-bottom:20px; font-weight:800; }
.container{ background:#fff; max-width:900%; width:110%; margin:auto; padding:20px; border-radius:20px; box-shadow:0 10px 30px rgba(61,15,29,.15); }
@media(min-width: 1024px){.container{ max-width:98%; padding:30px; }.form-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:15px; }.btn-group{ display:flex; gap:12px; }.btn{ width:auto; flex:1; }}
.form-group{ margin-bottom:15px; }
select{ width:100%; padding:14px; border:1px solid #ccc; border-radius:10px; font-size:16px; background:#f3f3f3; }
.btn{ background:#00b140; color:#fff; border:none; padding:15px; border-radius:10px; font-size:18px; cursor:pointer; font-weight:700; width:100%; margin-bottom:12px; }
.btn:hover{ opacity:.9; }
.btn-print{ background:#2563eb; }
.table-wrapper{overflow-x:auto; max-height:none; overflow-y:visible}
.marks-table{ width:100%; border-collapse:collapse; min-width:700px; }
.marks-table th{ background:#1e5eff; color:#fff; padding:12px 8px; border:1px solid #ddd; text-align:center; font-size:14px; white-space:nowrap }
.marks-table td{ border:1px solid #ddd; padding:8px; text-align:center; font-size:14px; white-space:nowrap }
.alert{ padding:12px; border-radius:8px; margin-bottom:15px; display:none; font-weight:bold; text-align:center; }
.alert.error{background:#fee2e2;color:#991b1b;}.alert.success{background:#d1fae5;color:#065f46;}
sup{ font-size:10px; vertical-align:super; }
#printHeader{display:none;text-align:center;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #000}
#printHeader h2{margin:0;background:none;color:#000;font-size:20px}
@media print { .form-grid,.btn-group, h1 {display:none} body{background:white} #printHeader{display:block!important} table, th, td {border: 1px solid #000;} }
</style>
</head>
<body>
<h1></h1>
<div class="container">
    <div id="printHeader">
        <h2>SAUTUL HAQQ PRIMARY SCHOOL</h2>
        <h3>VIEW SAVED MARKS</h3>
        <p><b>Class:</b> <span id="printClass"></span> | <b>Subject:</b> <span id="printSubject"></span> | <b>Session:</b> <span id="printSession"></span> | <b>Term:</b> <span id="printTerm"></span></p>
    </div>
    <div id="alertBox" class="alert"></div>
    <div class="form-grid">
        <div class="form-group"><select id="vsClass"><option value="">Select Class</option></select></div>
        <div class="form-group"><select id="vsSubject"><option value="">Select Subject</option></select></div>
        <div class="form-group"><select id="vsSession"><option value="">Select Session</option></select></div>
        <div class="form-group"><select id="vsTerm"><option value="">Select Term</option></select></div>
    </div>
    <div class="btn-group">
        <button class="btn" onclick="viewMarks()">Load Students</button>
        <button class="btn btn-print" onclick="printSheet()">Print</button>
    </div>
    <div class="table-wrapper">
        <table class="marks-table">
            <thead><tr><th>S/N</th><th>STUDENT NAME</th><th>1ST C.A<br><small>20</small></th><th>2ND C.A<br><small>20</small></th><th>EXAM<br><small>60</small></th><th>TOTAL<br><small>100</small></th><th>GRADE</th><th>POSITION</th></tr></thead>
            <tbody id="viewBody"><tr><td colspan="8">Select filters and click Load Students</td></tr></tbody>
        </table>
    </div>
</div>
<script>
const db = window.supabase.createClient('https://izhxzibsixhbsucfquyt.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6aHh6aWJzaXhoYnN1Y2ZxdXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzk0NTgsImV4cCI6MjEwMDk1NTQ1OH0.vnP0BhywqE0kt1zrxwq7uGeJ76EOowOHXi5CNyMGWUM')
let currentResults = []; let sessionsList = []; let termsList = [];
function showAlert(msg, type){ const box = document.getElementById('alertBox'); box.className = `alert ${type}`; box.innerText = msg; box.style.display = 'block'; setTimeout(() => box.style.display = 'none', 3000) }
function getGrade(total){ total=parseInt(total)||0; if(total>=70)return 'A'; if(total>=60)return 'B'; if(total>=50)return 'C'; if(total>=45)return 'D'; if(total>=40)return 'E'; return 'F'; }
function getPosition(rank){ if(!rank) return ''; let suffix=['th','st','nd','rd']; let v=rank%100; return rank+'<sup>'+(suffix[(v-20)%10]||suffix[v]||suffix[0])+'</sup>'; }
function showBlank(val){ return (val==0||val==''||val==null)? '' : val }
function calculatePositions(){ let sorted=[...currentResults].filter(s=>s.total!=='').sort((a,b)=>b.total-a.total); let position=1; sorted.forEach((s,i)=>{ if(i>0&&s.total===sorted[i-1].total){s.position=sorted[i-1].position;}else{s.position=position;} position++; }); currentResults.filter(s=>s.total==='').forEach(s=>s.position=''); }

async function loadDropdowns(){
    const { data: sessions } = await db.from('primary_sessions').select('*')
    const { data: terms } = await db.from('primary_terms').select('*').order('term_name')
    const { data: subjects } = await db.from('primary_subjects').select('*').order('subject_name')
    const { data: classes } = await db.from('primary_classes').select('*').order('class_name')
    sessionsList = sessions||[]; termsList = terms||[];
    vsSession.innerHTML = '<option value="">Select Session</option>' + sessionsList.map(s => `<option value="${s.id}">${s.session_name}</option>`).join('')
    vsTerm.innerHTML = '<option value="">Select Term</option>' + termsList.map(t => `<option value="${t.id}">${t.term_name}</option>`).join('')
    vsClass.innerHTML = '<option value="">Select Class</option>' + (classes||[]).map(c => `<option value="${c.id}">${c.class_name}</option>`).join('')
    vsSubject.innerHTML = '<option value="">Select Subject</option>' + (subjects||[]).map(s => `<option value="${s.id}">${s.subject_name}</option>`).join('')
}
vsClass.onchange = async () => {
    let cid = vsClass.value;
    if(!cid) return;
    // Show ALL subjects for Admin - or filtered if you have class_subjects
    let {data: assigned} = await db.from('primary_class_subjects').select('*').eq('class_id', cid);
    if(assigned && assigned.length>0){
        vsSubject.innerHTML = '<option value="">Select Subject</option>' + assigned.map(s=>`<option value="${s.subject_id}">${s.subject_name}</option>`).join('')
    }else{
        let {data: allSubjects} = await db.from('primary_subjects').select('*').order('subject_name');
        vsSubject.innerHTML = '<option value="">Select Subject</option>' + (allSubjects||[]).map(s=>`<option value="${s.id}">${s.subject_name}</option>`).join('')
    }
}
async function viewMarks(){
    const clsId = vsClass.value; const subId = vsSubject.value; const sessId = vsSession.value; const termId = vsTerm.value;
    if(!clsId||!subId||!sessId||!termId) return showAlert('Please select all filters', 'error');
    showAlert('Loading...', 'success');
    document.getElementById('printClass').innerText = vsClass.options[vsClass.selectedIndex].text;
    document.getElementById('printSubject').innerText = vsSubject.options[vsSubject.selectedIndex].text;
    document.getElementById('printSession').innerText = sessionsList.find(s=>s.id==sessId)?.session_name;
    document.getElementById('printTerm').innerText = termsList.find(t=>t.id==termId)?.term_name;
    const { data: results, error } = await db.from('primary_results').select('*').eq('class_id', clsId).eq('subject_id', subId).eq('session_id', sessId).eq('term_id', termId);
    if(error) return showAlert('Error: ' + error.message, 'error');
    if(!results||results.length===0){ viewBody.innerHTML = '<tr><td colspan="8">No results found</td></tr>'; currentResults = []; return; }
    currentResults = results.map(r => { let total = (+r.ca1||0)+(+r.ca2||0)+(+r.exam||0); if(total==0 && !r.ca1 && !r.ca2 && !r.exam) total=''; return {...r, total: total, grade: total!==''? getGrade(total):'', position: 0} });
    calculatePositions();
    let displayList = [...currentResults].sort((a,b)=>{ if(a.total===''&&b.total==='')return 0; if(a.total==='')return 1; if(b.total==='')return -1; return b.total-a.total; });
    viewBody.innerHTML = displayList.map((r,i) => `<tr><td>${i+1}</td><td style="text-align:left">${r.student_name}</td><td>${showBlank(r.ca1)}</td><td>${showBlank(r.ca2)}</td><td>${showBlank(r.exam)}</td><td>${showBlank(r.total)}</td><td>${r.grade}</td><td>${r.total!==''?getPosition(r.position):''}</td></tr>`).join('');
    showAlert('Loaded Successfully', 'success');
    if(window.parent) window.parent.postMessage('resize','*');
}
function printSheet(){ document.getElementById('printHeader').style.display='block'; window.print(); setTimeout(()=>document.getElementById('printHeader').style.display='none',500); }
loadDropdowns();
</script>
</body>
</html>
