<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5e1a2e">
<title>Teacher Code - Sautul Haqq</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap');
  :root{
    --wine:#5e1a2e;--wine-2:#7b2640;--wine-hi:#7e2a44;--wine-lo:#3d0f1d;
    --sand:#eae2d8;--hi:#fbf7f1;--lo:#c8bcae;
    --ink:#2a1a1f;--muted:#7a6a68;--err:#b42318;
    --raise:8px 8px 18px var(--lo),-8px -8px 18px var(--hi);
    --press:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;font-family:'Manrope','Segoe UI',sans-serif;color:var(--ink);background:var(--sand);display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:430px;border-radius:32px;overflow:hidden;background:var(--sand);box-shadow:var(--raise),0 24px 50px rgba(94,26,46,.12)}

  .top{background:var(--wine);color:#fff;text-align:center;padding:34px 26px 46px;border-radius:0 0 50% 50% / 0 0 34px 34px}
  .arch{width:132px;height:156px;margin:0 auto 18px;border-radius:66px 66px 16px 16px;background:var(--wine);padding:10px;box-shadow:8px 8px 16px var(--wine-lo),-8px -8px 16px var(--wine-hi);display:flex;align-items:center;justify-content:center}
  .arch img{width:100%;height:100%;object-fit:contain;border-radius:56px 56px 8px 8px;background:#fff}
  .top h1{font-family:'Lora',Georgia,serif;font-size:24px;line-height:1.2;font-weight:700;margin-bottom:12px}
  .portal{display:inline-block;padding:8px 18px;border-radius:30px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f0d9a0;box-shadow:inset 4px 4px 8px var(--wine-lo),inset -4px -4px 8px var(--wine-hi)}

  .body{padding:28px 28px 24px}
  .body h2{font-family:'Lora',Georgia,serif;font-size:22px;margin-bottom:3px;text-align:center}
  .sub{font-size:13.5px;color:var(--muted);margin-bottom:22px;text-align:center}
  .field{margin-bottom:20px}
  .field label{display:block;font-size:12.5px;font-weight:700;margin:0 0 8px;color:#4a3a3d;text-align:center}
  .field input{width:100%;height:54px;padding:0 18px;font:inherit;font-size:16px;font-weight:600;text-align:center;text-transform:uppercase;letter-spacing:2px;color:var(--ink);background:var(--sand);border:none;border-radius:14px;box-shadow:var(--press);transition:box-shadow .2s}
  .field input::placeholder{color:#aa9e92;text-transform:none;letter-spacing:normal;font-weight:500}
  .field input:focus{outline:none;box-shadow:var(--press),0 0 0 2px rgba(94,26,46,.45)}

  .btn{width:100%;height:54px;border:none;border-radius:16px;background:var(--wine);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:7px 7px 14px var(--lo),-7px -7px 14px var(--hi);transition:box-shadow .15s}
  .btn:active,.btn:disabled{box-shadow:inset 4px 4px 8px var(--wine-lo),inset -4px -4px 8px var(--wine-hi)}
  .btn:disabled{pointer-events:none}
  .btn:focus-visible{outline:2px solid var(--wine-2);outline-offset:3px}

  .error{display:none;margin-top:16px;padding:12px 14px;border-radius:14px;box-shadow:var(--press);color:var(--err);font-size:13.5px;font-weight:700;text-align:center}
  .error.show{display:block;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--muted)}

  @media(max-width:480px){
    body{padding:0;align-items:stretch}
    .card{max-width:none;border-radius:0;box-shadow:none;min-height:100vh}
    .top{padding:26px 22px 42px}
    .arch{width:104px;height:124px;border-radius:52px 52px 14px 14px;margin-bottom:14px;padding:8px}
    .arch img{border-radius:44px 44px 6px 6px}
    .top h1{font-size:21px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="card">
  <section class="top">
    <div class="arch"><img src="my-logo.png" alt="Sautul Haqq Islamic School logo"></div>
    <h1>Sautul Haqq</br> Primary School</h1>
    <div class="portal">Teacher Code</div>
  </section>

  <section class="body">
    <h2>Welcome, Teacher</h2>
    <p class="sub">Enter your teacher code to continue.</p>

    <form id="codeForm" novalidate>
      <div class="field">
        <label for="teacherCode">Teacher Code</label>
        <input type="text" id="teacherCode" placeholder="e.g TCH001" autocomplete="off" autocapitalize="characters" required>
      </div>
      <button type="submit" class="btn" id="continueBtn">Continue</button>
      <p class="error" id="errorMsg" role="alert">Invalid Teacher Code</p>
    </form>

    <div class="footer">© Sautul Haqq Primary School</div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://izhxzibsixhbsucfquyt.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6aHh6aWJzaXhoYnN1Y2ZxdXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzk0NTgsImV4cCI6MjEwMDk1NTQ1OH0.vnP0BhywqE0kt1zrxwq7uGeJ76EOowOHXi5CNyMGWUM'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const SUPER_ADMIN_MASTER_CODE = "ZUKS2005";

function showError(msg){
  const el = document.getElementById('errorMsg');
  el.innerText = msg;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

document.getElementById('codeForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const codeInput = document.getElementById('teacherCode');
    const code = codeInput.value.trim().toUpperCase();
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('continueBtn');

    errorMsg.classList.remove('show');

    if(code === '') {
        showError('Please enter teacher code');
        return;
    }

    btn.innerText = 'Checking...';
    btn.disabled = true;

    // 1. SUPER ADMIN MASTER CODE
    if(code === SUPER_ADMIN_MASTER_CODE){
        localStorage.setItem('isSuper', 'true');
        localStorage.setItem('userRole', 'Teacher');
        localStorage.setItem('teacherCode', 'SUPERADMIN');
        localStorage.setItem('teacherName', 'Super Admin');
        localStorage.setItem('teacherId', '0');
        window.location.href = 'TeacherDashboard.html';
        return;
    }

    // 2. CHECK FROM primary_teachers TABLE
    const { data, error } = await db.from('primary_teachers')
        .select('*')
        .eq('teacher_code', code)
        .single();

    btn.innerText = 'Continue';
    btn.disabled = false;

    if(error || !data){
        console.log(error);
        showError('Invalid Teacher Code');
        return;
    }

    // 3. SAVE AND GO
    localStorage.setItem('isSuper', 'false');
    localStorage.setItem('userRole', 'Teacher');
    localStorage.setItem('teacherCode', data.teacher_code);
    localStorage.setItem('teacherName', data.teacher_name || data.name || 'Teacher');
    localStorage.setItem('teacherId', data.id);
    if(data.class_name) localStorage.setItem('teacherClass', data.class_name);

    window.location.href = 'Primary-TeacherDashboard.html';
});
</script>
</body>
</html>
