<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAUTUL-HAQQ - Monitor FINAL - Reads primary_teacher_subjects</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#eae2d8;color:#2a1a1f}
.header{background:linear-gradient(135deg,#7b2640,#5e1a2e);color:#fff;padding:22px;text-align:center}
.header h2{font-size:24px;font-weight:900}.header p{font-size:12px;opacity:.9;letter-spacing:1px;margin-top:4px;text-transform:uppercase}
.container{max-width:1150px;margin:20px auto;padding:0 14px}
.panel{background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 20px rgba(61,15,29,.08);border:1px solid #d9cdbd;margin-bottom:18px}
.panel h3{color:#5e1a2e;font-weight:800;margin-bottom:12px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{font-size:11px;font-weight:800;color:#7a6a68;text-transform:uppercase;margin-bottom:6px;display:block}
select{width:100%;padding:13px;border:1.5px solid #d9cdbd;border-radius:10px;background:#fbf8f3;font-weight:700;font-size:14px;outline:none}
select:focus{border-color:#5e1a2e;background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:#fff;padding:20px;border-radius:12px;text-align:center;border-top:4px solid #ddd;box-shadow:0 2px 8px rgba(61,15,29,.06)}
.stat-card.submitted{border-color:#16a34a}.stat-card.partial{border-color:#f59e0b}.stat-card.pending{border-color:#dc2626}
.stat-card h2{font-size:30px;font-weight:900}
.table-wrap{overflow-x:auto;border:1px solid #d9cdbd;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:900px}
th{padding:13px;background:#f1e6e8;color:#5e1a2e;font-weight:800;font-size:11px;text-transform:uppercase;text-align:left;border-bottom:2px solid #dcc3c8}
td{padding:13px;border-bottom:1px solid #f1ebe4;font-size:13px;font-weight:700;background:#fff;color:#000}
tr:hover td{background:#faf4f5}
.status{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;display:inline-flex;gap:4px;align-items:center}
.status.submitted{background:#dcfce7;color:#166534}.status.submitted:before{content:'✓'}
.status.partial{background:#fef3c7;color:#92400e}.status.partial:before{content:'◐'}
.status.pending{background:#fee2e2;color:#991b1b}.status.pending:before{content:'○'}
.progress{width:110px;height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,#16a34a,#22c55e);width:0%;transition:.5s}
.teacher{background:#dcfce7;color:#065f46;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800;border:1px solid #bbf7d0;display:inline-flex;gap:5px;align-items:center}
.teacher.no{background:#fee2e2;color:#991b1b;border-color:#fecaca}
button{border:none;background:#0868a8;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}
#msg{padding:12px;border-radius:10px;margin-bottom:14px;display:none;font-weight:700;font-size:13px;border:1px solid}
#msg.ok{display:block;background:#dcfce7;color:#166534;border-color:#bbf7d0}
#msg.err{display:block;background:#fee2e2;color:#991b1b;border-color:#fecaca}
#msg.info{display:block;background:#f1e6e8;color:#5e1a2e;border-color:#dcc3c8}
.empty{text-align:center;padding:24px;color:#7a6a68}
@media(max-width:700px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><h2>SAUTUL-HAQQ SCHOOL</h2><p>PRIMARY — MARKS SUBMISSION MONITOR </p></div>
<div class="container">
<div class="panel"><h3>Select Class, Term, Session</h3><div class="filters"><div><label>Class</label><select id="classSelect"><option>Loading...</option></select></div><div><label>Term</label><select id="termSelect"><option>Loading...</option></select></div><div><label>Session</label><select id="sessionSelect"><option>Loading...</option></select></div></div></div>
<div id="msg"></div>
<div class="stats"><div class="stat-card submitted"><h2 id="sCount">0</h2><p>Submitted</p></div><div class="stat-card partial"><h2 id="pCount">0</h2><p>Partial</p></div><div class="stat-card pending"><h2 id="peCount">0</h2><p>Pending</p></div></div>
<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px"><h3>Subject Submission Status</h3><button id="refreshBtn" onclick="loadStatus()">↻ Refresh Status</button></div><div class="table-wrap"><table><thead><tr><th>S/N</th><th>Subject</th><th>Subject Teacher</th><th>Students Marked</th><th>Progress</th><th>Status</th></tr></thead><tbody id="tbody"><tr><td colspan="6" class="empty">Select class, term and session</td></tr></tbody></table></div></div>
</div>
<script>
const db=window.supabase.createClient("https://izhxzibsixhbsucfquyt.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6aHh6aWJzaXhoYnN1Y2ZxdXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzk0NTgsImV4cCI6MjEwMDk1NTQ1OH0.vnP0BhywqE0kt1zrxwq7uGeJ76EOowOHXi5CNyMGWUM");
const classSelect=document.getElementById("classSelect"),termSelect=document.getElementById("termSelect"),sessionSelect=document.getElementById("sessionSelect"),tbody=document.getElementById("tbody"),msg=document.getElementById("msg"),refreshBtn=document.getElementById("refreshBtn");
function show(m,c){msg.textContent=m;msg.className=c;msg.style.display="block";} function hide(){msg.style.display="none";}
async function init(){
 const [cl,te,se]=await Promise.all([db.from("primary_classes").select("*").order("class_name"),db.from("primary_terms").select("*"),db.from("primary_sessions").select("*")]);
 classSelect.innerHTML='<option value="">Select Class</option>';termSelect.innerHTML='<option value="">Select Term</option>';sessionSelect.innerHTML='<option value="">Select Session</option>';
 cl.data.forEach(i=>classSelect.innerHTML+=`<option value="${i.id}">${i.class_name}</option>`);
 te.data.forEach(i=>termSelect.innerHTML+=`<option value="${i.id}">${i.term_name}</option>`);
 se.data.forEach(i=>sessionSelect.innerHTML+=`<option value="${i.id}">${i.session_name}</option>`);
 hide();
}
function hasMarks(r){return ["ca1","ca2","exam","total"].some(f=>r[f]!==null&&r[f]!==""&&r[f]!==undefined);}
async function loadStatus(){
 const classId=classSelect.value,termId=termSelect.value,sessionId=sessionSelect.value;
 if(!classId||!termId||!sessionId){show("Please select class, term and session","info");return;}
 refreshBtn.disabled=true;refreshBtn.textContent="Loading...";
 tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:24px">Checking teacher submissions...</td></tr>`;
 try{
  const [stu,subj,teacherSubj,res]=await Promise.all([
   db.from("primary_students").select("id").eq("class_id",classId),
   db.from("primary_class_subjects").select("*").eq("class_id",classId).order("subject_name"),
   db.from("primary_teacher_subjects").select("*").eq("class_id",classId),
   db.from("primary_results").select("*").eq("class_id",classId).eq("term_id",termId).eq("session_id",sessionId).range(0,5000)
  ]);

  if(!subj.data || subj.data.length===0){
    tbody.innerHTML=`<tr><td colspan="6" class="empty">No subjects assigned to this class</td></tr>`;
    document.getElementById("sCount").textContent=0;document.getElementById("pCount").textContent=0;document.getElementById("peCount").textContent=0;
    return;
  }

  const total=stu.data?stu.data.length:0;
  let sub=0,par=0,pen=0,html="";

  subj.data.forEach((sj,i)=>{
    // === FIXED: READ FROM primary_teacher_subjects TABLE ===
    let tName="Not Assigned";
    // Find teacher assigned to THIS class AND THIS subject
    let match = teacherSubj.data.find(ts => 
      String(ts.subject_id) === String(sj.subject_id) && 
      String(ts.class_id) === String(classId)
    );
    // If not found by class_id, try by subject_id only (your dashboard sometimes saves class_name)
    if(!match){
      match = teacherSubj.data.find(ts => String(ts.subject_id) === String(sj.subject_id));
    }
    // If still not found, try by subject_name
    if(!match){
      match = teacherSubj.data.find(ts => ts.subject_name && sj.subject_name && ts.subject_name.toLowerCase() === sj.subject_name.toLowerCase());
    }

    if(match){
      tName = match.teacher_name || "Unknown Teacher";
      // If teacher_name is code, try to get real name
      if(tName.startsWith("TCH") && match.teacher_name){
        // teacher_name field already has real name in your screenshot
        tName = match.teacher_name;
      }
    }

    const filtered=res.data.filter(r=>String(r.subject_id)===String(sj.subject_id));
    const marked=new Set();filtered.forEach(r=>{if(hasMarks(r)) marked.add(String(r.student_id));});
    const mk=marked.size;
    const perc=total>0?Math.min(100,Math.round(mk/total*100)):0;
    let status,cls;
    if(mk===0){status="Pending";cls="pending";pen++;}
    else if(mk>=total){status="Submitted";cls="submitted";sub++;}
    else{status="Partial";cls="partial";par++;}

    const badge=tName==="Not Assigned"?`<span class="teacher no">⚠ Not Assigned</span>`:`<span class="teacher">👨‍🏫 ${tName}</span>`;

    html+=`<tr>
      <td>${i+1}</td>
      <td><b>${sj.subject_name}</b></td>
      <td>${badge}</td>
      <td><b>${mk}</b> / ${total}</td>
      <td><div class="progress"><div class="progress-bar" style="width:${perc}%"></div></div><small style="font-weight:800;color:#475569">${perc}%</small></td>
      <td><span class="status ${cls}">${status}</span></td>
    </tr>`;
  });

  tbody.innerHTML=html;
  document.getElementById("sCount").textContent=sub;
  document.getElementById("pCount").textContent=par;
  document.getElementById("peCount").textContent=pen;
  show(`Success! ${subj.data.length} `, "ok");

 }catch(e){
  console.error(e);
  tbody.innerHTML=`<tr><td colspan="6" class="empty">Error: ${e.message}</td></tr>`;
  show("Error: "+e.message,"err");
 }finally{
  refreshBtn.disabled=false;refreshBtn.textContent="↻ Refresh Status";
 }
}
classSelect.addEventListener("change",loadStatus);
termSelect.addEventListener("change",loadStatus);
sessionSelect.addEventListener("change",loadStatus);
init();
</script>
</body>
</html>
