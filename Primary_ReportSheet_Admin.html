<!DOCTYPE html>

<style>
:root{--blue:#0868a8;--navy:#082e63;--pale:#eaf6ff;--line:#4a9bd0;--yellow:#ffd43b}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#eef2f5;color:var(--navy);font-family:Arial,Helvetica,sans-serif}
.controls{max-width:210mm;margin:0 auto 12px;background:#fff;padding:12px;border-radius:10px;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 2px 8px #0001;position:sticky;top:0;z-index:10}
.controls select,.controls button{padding:10px;border-radius:6px;border:1px solid #ccc;font-size:13px}
.controls button{background:var(--blue);color:#fff;border:none;font-weight:bold;cursor:pointer}
.controls button.save{background:#16a34a}
.sheet{width:210mm;min-height:297mm;margin:0 auto 10mm;padding:5mm;background:white;border:2mm solid var(--blue);box-shadow:0 3px 18px #0002;display:flex;flex-direction:column;gap:3mm;page-break-after:always}
.school-header{display:grid;grid-template-columns:35mm 1fr;gap:3mm;align-items:center;text-align:center;border-bottom:1.5mm solid var(--yellow);padding:1mm 0 3mm}
.logo-box{width:29mm;height:29mm;border:1mm solid var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.logo-box img{width:100%;height:100%;object-fit:cover;display:block}
.motto{margin-top:1mm;border:1px solid var(--blue);border-radius:3mm;padding:1mm 2mm;font-size:7.5pt;font-weight:bold;color:#bd1e3d}
h1{font-size:23pt;line-height:1.05;margin:0 0 2mm;font-weight:900;color:var(--navy)}
.address{font-weight:800;font-size:11pt;line-height:1.35;color:#124e88}
.report-title{font-size:15pt;font-style:italic;font-weight:800;margin-top:3mm}
.student-info{display:grid;grid-template-columns:1.2fr 1fr;gap:2mm 8mm;padding:3mm;border:1px solid #9acbe8;border-radius:4mm;background:var(--pale);font-size:10pt}
.field{display:flex;align-items:end;gap:2mm;min-height:7mm}
.field strong{white-space:nowrap}
.write-line{border-bottom:1px solid var(--navy);height:5mm;flex:1;min-width:10mm;font-weight:900;color:#000}
.term-heading{align-self:center;background:var(--yellow);border-radius:12mm;padding:1.5mm 12mm;font-weight:900;font-size:17pt;text-align:center;color:#061f4b;min-width:82mm}
table{border-collapse:collapse;width:100%;table-layout:fixed}
.marks-table{font-size:8.2pt}
.marks-table th,.marks-table td{border:1px solid var(--line);padding:1.2mm 1mm}
.marks-table thead th{background:var(--blue);color:white;text-align:center;vertical-align:middle;font-size:8pt}
.marks-table tbody td{height:7.3mm;text-align:center;font-weight:700}
.marks-table .subject-name{text-align:left;padding-left:1mm;font-weight:800}
.marks-table .behaviour-name{text-align:left;padding-left:3mm;background:#f3faff;font-weight:700}
.marks-table .overall td{background:#dff2ff;font-weight:800;height:8mm}
.bottom-box{border:1px solid var(--line);border-radius:3mm;background:#f2faff;padding:3mm;display:flex;flex-direction:column;gap:3mm;font-size:10pt}
.promotion-row{display:flex;align-items:center;justify-content:center;gap:3mm;font-size:11pt;font-weight:800}
.promotion-badge{padding:2mm 8mm;border-radius:5mm;background:#fff;border:2px solid var(--blue);min-width:30mm;text-align:center}
.comment{display:flex;gap:2mm;align-items:end;min-height:6mm}
.dates{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1.2fr;gap:2mm;align-items:end}
.signature-row{display:grid;grid-template-columns:1fr 1fr;gap:20mm;padding:2mm 4mm 0}
.signature{text-align:center;font-size:9pt;font-weight:800;position:relative;display:flex;flex-direction:column;align-items:center}
.signature-upload-box{height:22mm;width:100%;border:1px dashed var(--blue);border-radius:2mm;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:1mm;background:#fff;cursor:pointer}
.signature-upload-box img{width:100%;height:100%;object-fit:fill;display:none}
.signature-upload-box.has-img{border:1px solid #aaa}
.signature-upload-box.has-img img{display:block!important;width:100%!important;height:100%!important;object-fit:fill!important}
.signature-label{cursor:pointer;color:var(--blue);font-size:8pt;padding:2mm;display:block}
.signature-upload-box input[type="file"]{display:none}
.remove-sig{position:absolute;top:-6px;right:-6px;background:#cc0000;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:none;z-index:5}
.signature.has-img .remove-sig{display:block}
.sig-title{font-weight:900;text-align:center;width:100%;margin-top:1mm;color:#000}
sup{font-size:0.6em;vertical-align:super;font-weight:bold}
.grading{display:flex;justify-content:space-around;align-items:center;gap:2mm;border:1.2px solid #e6a900;background:#fff0a8;border-radius:2mm;padding:2.5mm 1mm;font-size:9pt;font-weight:800;text-align:center}
.marks-table.third{font-size:7pt}
.marks-table.third th,.marks-table.third td{padding:1mm .4mm}
.marks-table.third thead th{height:9mm}
.marks-table.third thead th.small,.marks-table.third thead th.total,.marks-table.third thead th.grade,.marks-table.third thead th.percentage,.marks-table.third thead th.position,.marks-table.third thead th.rating{height:24mm;padding:1mm 0}
.vertical{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto;white-space:nowrap;font-size:7pt}
.marks-table.third .behaviour-name{font-size:6.5pt;padding-left:1mm}
.marks-table.third thead th.subject{width:30mm}
.marks-table.third thead th.behaviour{width:26mm}
@page{size:A4 portrait;margin:0}
@media print{body{padding:0;background:white}.controls{display:none}.sheet{margin:0;width:210mm;min-height:297mm;border:2mm solid var(--blue);box-shadow:none} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

document.getElementById("status").innerText="Saving signatures...";
const {error}=await db.from("primary_signatures").upsert({

 async function generateReport(){
const classId=document.getElementById("classSelect").value;
const termId=document.getElementById("termSelect").value;

if(!classId||!termId||!sessionId){alert("Select Class, Term, Session");return;}

const sessionName=document.getElementById("sessionSelect").options[document.getElementById("sessionSelect").selectedIndex].text;

const rt=r=>r?(Number(r.total)||(Number(r.ca1)||0)+(Number(r.ca2)||0)+(Number(r.exam)||0)):0;
const same=(a,b)=>String(a)===String(b);
try{
const resultsData=await Promise.all([
db.from("primary_students").select("*").eq("class_id",classId).order("student_name"),
db.from("primary_class_subjects").select("*").eq("class_id",classId).order("subject_name"),
db.from("primary_results").select("*").eq("class_id",classId).eq("term_id",termId).eq("session_id",sessionId),
db.from("primary_form_comments").select("*").eq("class_id",classId).eq("term_id",termId).eq("session_id",sessionId),
db.from("primary_signatures").select("*").eq("class_id",classId).eq("term_id",termId).eq("session_id",sessionId).maybeSingle(),
db.from("primary_behaviour_ratings").select("*").eq("class_id",classId).eq("term_id",termId).eq("session_id",sessionId)
]);
const allStudents=resultsData[0].data||[];
const classSubjects=resultsData[1].data||[];
const results=resultsData[2].data||[];
const formComments=resultsData[3].data||[];
const savedSigs=resultsData[4].data||null;
const behaviourScores=resultsData[5].data||[];
let res1=[],res2=[],beh1=[],beh2=[];
if(is3rd){
const termOpts=[...document.getElementById("termSelect").options].filter(o=>o.value).map(o=>({id:o.value,name:o.text}));
const t1=termOpts.find(t=>/1st|first/i.test(t.name))||termOpts[0];
const t2=termOpts.find(t=>/2nd|second/i.test(t.name))||termOpts[1];
if(t1&&t2){
const q=(table,t)=>db.from(table).select("*").eq("class_id",classId).eq("session_id",sessionId).eq("term_id",t.id);
const pr=await Promise.all([q("primary_results",t1),q("primary_results",t2),q("primary_behaviour_ratings",t1),q("primary_behaviour_ratings",t2)]);
res1=pr[0].data||[]; res2=pr[1].data||[]; beh1=pr[2].data||[]; beh2=pr[3].data||[];
}
}

const commentMap={}; formComments.forEach(c=>commentMap[c.student_id]=c);
const termInfo=formComments[0]||{};

behaviourScores.forEach(b=>{
if(!behavMap[b.student_id]) behavMap[b.student_id]={};
behavMap[b.student_id][b.trait_name]=b.score;
});
const find=(arr,sid,subjId)=>arr.find(x=>same(x.student_id,sid)&&same(x.subject_id,subjId));
const cell={};
allStudents.forEach(st=>{
cell[st.id]={};
classSubjects.forEach(subj=>{
const r=find(results,st.id,subj.subject_id);
const cur=r?rt(r):"";
let s1="",s2="",cum=cur;
if(is3rd){
const r1=find(res1,st.id,subj.subject_id), r2=find(res2,st.id,subj.subject_id);
s1=r1?rt(r1):""; s2=r2?rt(r2):"";
const list=[s1,s2,cur].filter(v=>v!=="");
cum=list.length?list.reduce((a,b)=>a+Number(b),0):"";
}
cell[st.id][subj.subject_id]={cur,s1,s2,cum};
});
});
let totalsMap={}; let studentTotals=[];
allStudents.forEach(st=>{
let sum=0; classSubjects.forEach(subj=>{ const c=cell[st.id][subj.subject_id].cum; sum+=Number(c)||0; });
totalsMap[st.id]=sum; studentTotals.push({id:st.id,sum});
});

let pos=1; let mapPos={}; studentTotals.forEach((t,i)=>{ if(i>0 && t.sum<studentTotals[i-1].sum) pos=i+1; mapPos[t.id]=pos; });
const classAvg=studentTotals.length ? studentTotals.reduce((a,b)=>a+b.sum,0)/studentTotals.length : 0;

else{ isPass=overall>=classAvg; resultText=isPass?"PASS":"FAIL"; }
let rowsHTML="";
const nRows=Math.max(classSubjects.length,behaviours.length);
for(let i=0;i<nRows;i++){

const b3=bName?(myBehav[bName]??""):"";
let ca1="",ca2="",exam="",total="",grade="",perc="",subjPos="",s1="",s2="",cum="";
if(subj){
const r=find(results,student.id,subj.subject_id);
const c=cell[student.id][subj.subject_id];
ca1=r?(Number(r.ca1)||0):""; ca2=r?(Number(r.ca2)||0):""; exam=r?(Number(r.exam)||0):"";
total=c.cur; s1=c.s1; s2=c.s2; cum=c.cum;
const sp=subjectPositions[subj.subject_id]?.[student.id]; subjPos=sp?supOrdinal(sp):"-";
if(total!==""){ grade=getGrade(total); perc=total+"%"; }
}

if(is3rd){
const g=(arr)=>{const x=arr.find(b=>same(b.student_id,student.id)&&b.trait_name==bName); return x?x.score:"";};
const b1=bName?g(beh1):"", b2=bName?g(beh2):"";
const nums=[b1,b2,b3].filter(v=>v!==""&&!isNaN(v)).map(Number);
const bAvg=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1):"";
rowsHTML+=`<tr><td class="subject-name">${sName}</td><td>${ca1}</td><td>${ca2}</td><td>${exam}</td><td><b>${total}</b></td><td>${s1}</td><td>${s2}</td><td>${total}</td><td><b>${cum}</b></td><td><b>${grade}</b></td><td>${perc}</td><td>${subjPos}</td><td class="behaviour-name">${bName}</td><td>${b1}</td><td>${b2}</td><td style="font-weight:900;color:#000">${b3}</td><td style="font-weight:900;color:#000">${bAvg}</td></tr>`;
}else{
rowsHTML+=`<tr><td class="subject-name">${sName}</td><td>${ca1}</td><td>${ca2}</td><td>${exam}</td><td><b>${total}</b></td><td><b>${grade}</b></td><td>${perc}</td><td>${subjPos}</td><td class="behaviour-name">${bName}</td><td style="font-weight:900;color:#000">${b3}</td></tr>`;
}
}

<table class="marks-table third">
<thead>
<tr>
<th rowspan="2" class="subject">SUBJECTS</th>
<th rowspan="2" class="small"><div class="vertical">1st Assessment</div></th>

<table class="marks-table">
