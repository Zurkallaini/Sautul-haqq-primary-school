<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Behaviour & Physical Activity - ADMIN</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eae2d8;--card:#fff;--ink:#2a1a1f;--mute:#7a6a68;--line:#d9cdbd;--green:#5e1a2e;--green-d:#3d0f1d;--gold:#d9a62e;--soft:#f1e6e8;--field:#fbf8f3;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Public Sans,system-ui,sans-serif;padding:0}
header{background:var(--green);color:#fff;border-bottom:4px solid var(--gold);padding:20px 16px 50px}
.hd{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.crest{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--green-d);display:grid;place-items:center;font-weight:800}
h1{font:700 22px Newsreader,serif;margin:0}
main{max-width:1100px;margin:-34px auto 0;padding:0 12px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(61,15,29,.08)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h2{font:700 18px Newsreader,serif;margin:0;color:var(--green-d)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{font-size:12px;font-weight:600;color:var(--mute);display:block;margin-bottom:4px}
select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--field);font:inherit}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{padding:11px 18px;border-radius:8px;border:1.5px solid var(--green);font-weight:700;cursor:pointer}
.load{background:#fff;color:var(--green)} .save{background:#0b5d4b;color:#fff;border-color:#0b5d4b}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:1100px}
th{background:var(--green);color:#fff;font-size:11px;padding:10px 6px;text-align:center;min-width:72px;white-space:nowrap;position:sticky;top:0}
th:first-child,td:first-child{position:sticky;left:0;text-align:left;min-width:160px;z-index:2}
td:first-child{background:#fff;font-weight:600;font-size:13px;padding:10px;border-right:1px solid var(--line)}
td{border-top:1px solid var(--line);padding:4px;text-align:center;background:#fff}
tr:nth-child(even) td{background:var(--soft)}
td input{width:58px;text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:6px}
td input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(94,26,46,.15)}
.chip{background:var(--soft);color:var(--green-d);font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a1a1f;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.slide-hint{font-size:11px;color:var(--mute);text-align:right;margin:0 0 6px}
.badge{background:var(--green);color:#fff;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700}
</style></head><body>
<header><div class="hd"><div class="crest"></div><div><div style="font-size:12px;opacity:.8"></div><h1>Behaviour & Physical Activities - ADMIN</h1></div></div></header>
<main>
<div class="panel">
<div class="ph"><h2>Select Class</h2><span class="chip" id="countTop"></span></div>
<div class="grid">
<div><label>Class</label><select id="cls"><option value="">Select Class</option></select></div>
<div><label>Session</label><select id="ses"><option value="">Select Session</option></select></div>
<div><label>Term</label><select id="trm"><option value="">Select Term</option></select></div>
</div>
<div class="actions"><button class="load" id="loadBtn">Load Students</button><button class="save" id="saveBtn">Save</button></div>
</div>

<div class="panel" id="area" hidden>
<div class="ph"><h2>Rating Sheet - Score 0 to 5</h2><span class="chip" id="count">0 students</span></div>
<p class="slide-hint"></p>
<div class="wrap"><table id="tbl"></table></div>
</div>
</main>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL="https://izhxzibsixhbsucfquyt.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6aHh6aWJzaXhoYnN1Y2ZxdXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzk0NTgsImV4cCI6MjEwMDk1NTQ1OH0.vnP0BhywqE0kt1zrxwq7uGeJ76EOowOHXi5CNyMGWUM";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var $=id=>document.getElementById(id);
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
var TRAITS=["Punctuality","Attendance","Attitude to Assignments","Attitude to Class work","Respect","Honesty","Self Control","Leadership & Team Spirit","Sports","Neatness","Politeness","Cleanliness","Hardworking","Initiative"];
var students=[], currentMap={};

async function loadDropdowns(){
  // Class, Session and Term start empty - the admin must choose them
  const {data:classes}=await db.from("primary_classes").select("*").order("class_name");
  $("cls").innerHTML=`<option value="">Select Class</option>`+(classes||[]).map(c=>`<option value="${c.id}">${c.class_name}</option>`).join("");
  const {data:sessions}=await db.from("primary_sessions").select("*").order("id");
  $("ses").innerHTML=`<option value="">Select Session</option>`+(sessions||[]).map(s=>`<option value="${s.id}">${s.session_name}</option>`).join("");
  const {data:terms}=await db.from("primary_terms").select("*").order("id");
  $("trm").innerHTML=`<option value="">Select Term</option>`+(terms||[]).map(t=>`<option value="${t.id}">${t.term_name}</option>`).join("");
  $("countTop").textContent=(classes?.length||0)+" classes";
}
loadDropdowns();

function render(){
  let h="<tr><th>Student</th>"; TRAITS.forEach(t=>h+=`<th>${t}</th>`); h+="</tr>";
  students.forEach(st=>{
    h+=`<tr><td>${st.student_name}</td>`;
    TRAITS.forEach(tr=>{
      const key=`${st.id}__${tr}`; const v=currentMap[key]!==undefined?currentMap[key]:"";
      h+=`<td><input type="number" min="0" max="5" step="0.5" data-student="${st.id}" data-trait="${tr.replace(/"/g,'&quot;')}" value="${v}"></td>`;
    });
    h+="</tr>";
  });
  $("tbl").innerHTML=h;
}
$("tbl").addEventListener("input",e=>{
  const t=e.target; if(t.tagName!=="INPUT") return;
  let x=parseFloat(t.value); if(isNaN(x)) { delete currentMap[`${t.dataset.student}__${t.dataset.trait}`]; return; }
  if(x<0) x=0; if(x>5) {x=5; t.value=5;} currentMap[`${t.dataset.student}__${t.dataset.trait}`]=x;
});

$("loadBtn").onclick=async()=>{
  const classId=$("cls").value, sessionId=$("ses").value, termId=$("trm").value;
  if(!classId||!sessionId||!termId){toast("Select class, session and term"); return;}
  toast("Loading...");
  const {data:studs}=await db.from("primary_students").select("*").eq("class_id",classId).order("student_name");
  const {data:ratings}=await db.from("primary_behaviour_ratings").select("*").eq("class_id",classId).eq("session_id",sessionId).eq("term_id",termId);
  students=studs||[]; currentMap={};
  ratings?.forEach(r=>{ currentMap[`${r.student_id}__${r.trait_name}`]=r.score; });
  $("count").textContent=students.length+" students"; 
  $("countTop").textContent=$("cls").options[$("cls").selectedIndex].text+" - "+students.length+" students";
  $("area").hidden=false; render(); toast(`Loaded ${students.length} students`);
};

$("saveBtn").onclick=async()=>{
  const classId=$("cls").value, sessionId=$("ses").value, termId=$("trm").value;
  if(!students.length){toast("Load first"); return;}
  if(!classId||!sessionId||!termId){toast("Select class, session and term"); return;}
  let payload=[]; for(let k in currentMap){ const [sid,trait]=k.split("__"); payload.push({class_id:classId,student_id:sid,term_id:termId,session_id:sessionId,trait_name:trait,score:currentMap[k]}); }
  if(!payload.length){toast("No scores to save"); return;}
  toast("Saving...");
  const {error}=await db.from("primary_behaviour_ratings").upsert(payload,{onConflict:'class_id,student_id,term_id,session_id,trait_name'});
  if(error){toast(error.message); return;} toast("Saved - Report will fetch it");
};
</script>
</body>
</html>
